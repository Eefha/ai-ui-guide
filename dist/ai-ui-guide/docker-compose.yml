services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ai-ui-guide:latest
    container_name: ai-ui-guide
    # 宿主端口可用 APP_PORT 覆盖：APP_PORT=80 ./deploy.sh
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 会话截图、SQLite、知识库都落在宿主目录，重建镜像不丢数据
      - ./backend/data:/workspace/backend/data
    restart: unless-stopped
    # 让 uvicorn 能收到 SIGTERM，docker stop 时优雅退出而不是硬杀
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 不限制日志，长期跑会把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
